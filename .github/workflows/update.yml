# Keeps the public website up to date, for free, with no server. Every run (every 2 hours, on every push to main,
# or by hand from the Actions tab):
#   • checks the live PBS site for a new weekly report (a few small requests); if there is one, downloads it, runs the
#     whole pipeline (parse → check against PBS → detect → explain → report → export) and commits the new week's data
#   • refreshes the price news and republishes the site
# Why not one Friday run: GitHub may delay or DROP scheduled runs when it is busy (it dropped our first Friday run),
# so every run does the cheap check and whichever runs happen pick up the new report.
# The Gemini key comes from the repository secret LLM_API_KEY; without it, explanations fall back to the
# plain template sentence. The site is published to GitHub Pages.
name: Update and publish

on:
  schedule:
    - cron: "37 */2 * * *"  # every 2 hours, off the hour (GitHub drops fewer runs then)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Full history check (also lists the Internet Archive; slow)"
        type: boolean
        default: false

permissions:
  contents: write   # commit the new week's data
  pages: write      # publish to GitHub Pages
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      FULL: ${{ inputs.full == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Install the pipeline
        run: pip install -r requirements-pipeline.txt && pip install -e .

      - name: Run the pipeline
        run: |
          if [ "$FULL" = "true" ]; then
            python -m mehngai.pipeline            # full history listing (live site + Internet Archive)
          else
            python -m mehngai.pipeline --recent   # live PBS site, last 60 days: new weeks only
          fi

      - uses: actions/setup-node@v4     # before the tests: one runs the chat Worker's guardrail (TypeScript)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tests (a failure stops publishing)
        run: pytest -q

      - name: Commit the new week's data
        run: |
          # only when a new PBS week arrived (a new parsed table); news-only changes are published, not committed
          if [ -z "$(git status --porcelain data/interim data/raw/manifest.csv)" ]; then
            echo "No new PBS report."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interim data/raw/manifest.csv data/explanations.csv reports
          git commit -m "data: PBS weekly report $(ls data/interim | sort | tail -1 | cut -c1-10)"
          git pull --rebase origin main
          git push

      - name: Build the website
        working-directory: web
        env:
          VITE_CHAT_URL: ${{ vars.VITE_CHAT_URL }}   # the chat Worker's address (public); no chat button if unset
        run: npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
