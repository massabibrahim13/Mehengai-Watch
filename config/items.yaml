# All 51 items of PBS's weekly Sensitive Price Indicator (SPI), 2015-16 base.
#
# How rows are matched (see docs/decisions.md, Phase 2):
#   Appendix-A lists items in a fixed order, so each item is found by its SL number.
#   PDF garbling often mangles long names ("Vegetable Ghee DALDA/HABIB or O"), so the name is only
#   used as a sanity check: the raw name and `name_prefix` must start the same way.
#
# price_type decides which report section an item belongs to (docs/decisions.md, "v2"):
#   market       — moves a little most weeks → anomaly detection ("unusual price moves")
#   fixed        — packaged / branded / set-price goods: flat for months, then one jump
#                  → listed as "price revisions" when the national price moves ≥ threshold
#   administered — set by the government or a regulator (petrol, power, gas…)
#                  → listed as "government price changes"; never called an anomaly
#
# aliases: search terms (English, Roman Urdu, Urdu). Units: what one price refers to.
# SL numbers are valid for the 2015-16 SPI base; its first report is 2019-09-05.
series_start: 2019-09-05

