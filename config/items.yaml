# v1 tracked items (8 market-priced essentials).
#
# How rows are matched (see docs/decisions.md, Phase 2):
#   Appendix-A lists items in a fixed order, so each item is found by its SL number.
#   PDF garbling often mangles long names ("Vegetable Ghee DALDA/HABIB or O"), so the name is only
#   used as a sanity check: the raw name and `name_prefix` must start the same way.
#
# SL numbers below are valid for the 2015-16 SPI base (51 items). Its first report is 2019-09-05;
# earlier weeks used the 2007-08 base with different numbering and units, so they are not loaded.
