# Mehngai Watch settings. Thresholds and window sizes get added here in later phases.

ingest:
  # First report week to download (inclusive). 2019 still includes some old-base (2007-08) weeks;
  # the parser handles both and Phase 2 decides where the usable series starts.
  start_date: 2019-01-01
  # Which PDF to download per week: "annex" = Appendix-A city-wise prices (our parse target).
  kinds: [annex]
  request_delay_seconds: 1.5
  timeout_seconds: 120
  max_retries: 3

clean:
  # Reject a price if it is more than this many times (or less than 1/this) the last accepted
  # price for the same item + city. 4.0 = the "±300%" sanity bound from CLAUDE.md.
  max_weekly_ratio: 4.0
  # Characters that must match between a raw item name and its name_prefix (garbled names are short).
  min_name_match_chars: 5

store:
  db_file: mehngai.db   # inside data/

detect:
  # The detector used for the weekly report (chosen in Phase 4 — see docs/decisions.md).
  # It only scores price_type "market" items; fixed/administered items are listed as price changes.
  production_method: L1_zscore
  # Minimum national % change to list a fixed-price revision / a government price change.
  # Smaller moves are mostly one city's shop nudging the 17-city average (see decisions.md, v2).
  price_changes:
    fixed: 2.0
    administered: 1.0
  # Severity cut-offs per method. Scores are signed (+ = up); cut-offs apply to |score|.
  L0_baseline:            # score = raw weekly % change
    watch: 10
    unusual: 20
    extreme: 35
  L1_zscore:              # score = robust z of this week's change vs the item's last `window` weeks
    window: 52            # weeks of "normal behaviour" (12 adapted too fast to ongoing surges; see decisions.md)
    min_periods: 12
    watch: 3.5
    unusual: 5
    extreme: 8
  L2_relative:            # same as L1, on (item change − basket change)
    watch: 3.5
    unusual: 5
    extreme: 8
  L3_seasonal:            # same as L1, on change after removing yearly seasonality + Ramazan effect
    watch: 3.5
    unusual: 5
    extreme: 8
    period: 52            # weeks in a seasonal cycle
    min_history: 104      # weeks of history before STL is fitted (2 full years)
    ramazan_weeks: [-2, 5]  # weeks around 1 Ramazan that get a Ramazan adjustment (covers Eid)
    min_ramazans: 2       # past Ramazans needed before the adjustment is used
    refit_every: 4        # refit STL every N weeks (robust fit is slow; seasonal shape changes slowly)
    seasonal_smooth_weeks: 5  # moving average over the fitted seasonal shape (removes week-to-week jaggedness)
    min_seasonal_strength: 0.4  # below this, the item is treated as non-seasonal (no seasonal adjustment)
  # Floor for the robust spread (log change per week): stops a flat item (e.g. ghee unchanged for
  # 12 weeks → MAD = 0) from turning a tiny move into an infinite z-score.
  mad_floor: 0.005

evaluate:
  # Fair comparison: give every method the same number of alerts (per week, all items together).
  alert_budget_per_week: 0.5

explain:
  provider: gemini
  model: gemini-3.8-flash         # pinned (not "latest") so results are reproducible
  fallback_model: gemini-3.5-flash-lite   # used when the main model is overloaded (HTTP 503) — same as the chat Worker
  temperature: 0.2                # low = consistent, factual wording
  timeout_seconds: 60
  request_delay_seconds: 6        # free tier allows ~10 requests/minute
  max_retries_on_rate_limit: 3
  max_wait_seconds: 90            # if the API asks us to wait longer (daily quota: 20 requests/day), give up → template
  max_words: 60                   # explanations longer than this are rejected
  typical_move_weeks: 52          # window for "the item's typical weekly move" (same as the detector)
  # Words that would accuse someone or claim a cause we were never given. Any hit → regenerate/fallback.
  banned_phrases: [hoard, mafia, cartel, profiteer, manipulat, gouging, smuggl, black market, greed,
                   due to, because, caused by, driven by, as a result, owing to, amid, triggered by,
                   blamed, thanks to, fuelled by, fueled by]

# The price agent (src/mehngai/agent): answers questions with explanations, using data tools. Inherits the
# explain settings above (provider, retries, banned phrases) and overrides these.
agent:
  model: gemini-3.8-flash
  fallback_model: gemini-3.5-flash-lite   # when the main model is overloaded or its daily quota is used up
  temperature: 0.3                # a little room for natural wording; facts still come only from the tools
  max_steps: 4                    # model turns per question (each turn = 1 request; free tier ~20/day per model)
  max_words: 250                  # longer answers are rejected (rewritten once, then the rules answer is used)
  show_thinking: true             # ask Gemini for a summary of its reasoning: recorded in LangSmith, never shown
  timeout_seconds: 45             # a person is waiting: if a model hangs, try the backup model, then answer
  max_retries_on_rate_limit: 2    # with the rules (the weekly pipeline waits longer: see explain above)

news:
  refresh_minutes: 30             # re-fetch feeds when the stored headlines are older than this
  keep_days: 45                   # headlines older than this aren't shown
  timeout_seconds: 20
  feeds:                          # public RSS feeds (free), tested 2026-10-10
    Dawn: https://www.dawn.com/feeds/business
    Business Recorder: https://www.brecorder.com/feeds/latest-news
    Express Tribune: https://tribune.com.pk/feed/business
    ProPakistani: https://propakistani.pk/feed/
    ARY News: https://arynews.tv/category/business/feed/
    APP: https://www.app.com.pk/business/feed/
  # A headline counts if it mentions a tracked item AND a price word, or is about inflation/SPI.
  price_words: [price, prices, priced, rate, rates, rupee, rupees, "rs", costlier, cheaper, expensive,
                hike, hiked, hikes, surge, surges, soar, soars, jump, jumps, increase, increased, decrease,
                decreased, cut, cuts, slash, slashed, reduce, reduced, tariff, tariffs, notified, shortage,
                inflation, mehngai, per kg, per litre, per maund]
  inflation_words: [inflation, spi, sensitive price, cpi, mehngai, price indicator]
  # Item aliases that mislead in headlines ("oil" = crude, "matches" = cricket, "gram" = gold per 10 g).
  ignore_aliases: [oil, tel, wood, cloth, matches, match, gram, cylinder, mash, lawn, tea, soap, bulb,
                   gasoline]
  # Headlines about other countries are dropped unless they also mention Pakistan.
  foreign_words: [america, american, americans, us, usa, uk, britain, india, indian, china, chinese,
                  europe, european, global, world, saudi, gulf, bangladesh, sri lanka]
  # Extra headline words that point to tracked items.
  extra_aliases:
    petroleum: [petrol, diesel]
    pol: [petrol, diesel]
    fuel prices: [petrol, diesel]
    nepra: [electricity]
    power tariff: [electricity]
    electricity tariff: [electricity]
    sngpl: [gas]
    ssgc: [gas]
    ogra: [lpg, gas]
