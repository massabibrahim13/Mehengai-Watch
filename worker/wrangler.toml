# Cloudflare Worker for the Mehngai Watch chat (free plan). Deploy: npx wrangler deploy
# The Gemini key is a secret (npx wrangler secret put LLM_API_KEY) — never in this file or the repo.
name = "mehngai-watch-chat"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# the prompt is a text file (a copy of src/mehngai/explain/prompts/parse_question.txt, kept identical by a test)
rules = [{ type = "Text", globs = ["**/*.txt"], fallthrough = true }]

[vars]
ALLOWED_ORIGINS = "https://massabibrahim13.github.io,http://localhost:5173"
SITE_DATA = "https://massabibrahim13.github.io/Mehengai-Watch/data/"
MODEL = "gemini-3.8-flash"
FALLBACK_MODEL = "gemini-3.5-flash-lite"   # used when the main model is overloaded (HTTP 503/429)
PER_VISITOR_DAILY = "3"   # AI readings per visitor per day
GLOBAL_DAILY = "15"       # all visitors together; Gemini's free tier is 20/day and the weekly run needs a few

# daily counters for the limits above (created with: npx wrangler kv namespace create LIMITS)
[[kv_namespaces]]
binding = "LIMITS"
id = "92e39a013c73444d920a0350d54e5424"
